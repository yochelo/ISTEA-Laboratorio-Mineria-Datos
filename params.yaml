split:
  test_size: 0.20
  random_state: 42

validation:
  n_splits: 5
  random_state: 42

selection:
  min_precision: 0.50

# Order also defines preference by simplicity in an exact tie.
candidates:
  - name: baseline
    family: dummy
    parameters: {strategy: most_frequent}
  - name: logistic
    family: logistic_regression
    parameters: {C: 1.0, max_iter: 1000}
  - name: logistic_balanced
    family: logistic_regression
    parameters: {C: 1.0, max_iter: 1000, class_weight: balanced}
  - name: logistic_balanced_regularized
    family: logistic_regression
    parameters: {C: 0.1, max_iter: 1000, class_weight: balanced}
  - name: random_forest
    family: random_forest
    parameters: {n_estimators: 100, random_state: 42}
  - name: random_forest_balanced
    family: random_forest
    parameters: {n_estimators: 100, random_state: 42, class_weight: balanced}
