name: Integración continua de churn

on:
  push:
    branches: [entrega-final]
  workflow_dispatch:

permissions:
  contents: read

env:
  MODELO_SHA256: be71d167d616f72260f4b04181971c6b76ff9f8a86cd20d32bbf7991eee7937e
  PAQUETE: ghcr.io/yochelo/istea-laboratorio-mineria-datos

jobs:
  verificar:
    name: Verificar, construir y publicar la API
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.publicar.outputs.digest }}
    defaults:
      run:
        shell: bash
    env:
      DVC_NO_ANALYTICS: "true"
    steps:
      - name: Recuperar el repositorio
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11.9"

      - name: Instalar y comprobar dependencias
        run: |
          python -m pip install -r requirements-ci.txt
          python -m pip check

      - name: Recuperar los artefactos aprobados de DagsHub
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.DAGSHUB_DVC_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.DAGSHUB_DVC_SECRET_ACCESS_KEY }}
        run: |
          if [[ -z "$AWS_ACCESS_KEY_ID" || -z "$AWS_SECRET_ACCESS_KEY" ]]; then
            echo "::error::Configurar los dos secretos DVC de DagsHub en GitHub Actions."
            exit 1
          fi
          dvc pull -r origin data/raw/customer_churn_historical.csv.dvc train data/production/customer_churn_current.csv.dvc

      - name: Verificar integridad del modelo y estado de DVC
        run: |
          printf '%s  %s\n' "$MODELO_SHA256" models/churn_model.joblib | sha256sum --check
          estado="$(dvc status --json)"
          printf '%s\n' "$estado"
          test "$estado" = '{}'

      - name: Ejecutar la suite completa de pytest
        run: python -m pytest -q

      - name: Validar la configuración y las alertas de Prometheus
        run: |
          docker run --rm --network none -v "$PWD/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool prom/prometheus:v3.5.0 check config /etc/prometheus/prometheus.yml
          docker run --rm --network none -v "$PWD/prometheus:/etc/prometheus:ro" \
            --entrypoint /bin/promtool prom/prometheus:v3.5.0 test rules /etc/prometheus/alerts.test.yml

      - name: Construir la imagen Docker
        run: |
          docker build --progress=plain \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            -t "$PAQUETE:sha-$GITHUB_SHA" .

      - name: Verificar la API por HTTP
        run: bash tests/smoke_docker.sh "$PAQUETE:sha-$GITHUB_SHA"

      - name: Publicar la imagen validada en GHCR
        id: publicar
        if: github.ref == 'refs/heads/entrega-final'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          registro="$(docker push "$PAQUETE:sha-$GITHUB_SHA")"
          printf '%s\n' "$registro"
          digest="$(awk '$2 == "digest:" {print $3}' <<< "$registro")"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

  verificar_ghcr:
    name: Descargar y verificar la imagen de GHCR
    needs: verificar
    if: github.ref == 'refs/heads/entrega-final'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: read
    defaults:
      run:
        shell: bash
    env:
      DIGEST: ${{ needs.verificar.outputs.digest }}
    steps:
      - name: Recuperar el smoke test y sus ejemplos
        uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v6.2.0
        with:
          python-version: "3.11.9"

      - name: Descargar la imagen por digest
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null' EXIT
          docker pull "$PAQUETE@$DIGEST"

      - name: Verificar procedencia y contenido de la imagen descargada
        run: |
          imagen="$PAQUETE@$DIGEST"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.source"}}' "$imagen")" = "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$imagen")" = "$GITHUB_SHA"
          docker run --rm --network none --entrypoint find "$imagen" /app -type f > "$RUNNER_TEMP/contenido-imagen"
          sort -o "$RUNNER_TEMP/contenido-imagen" "$RUNNER_TEMP/contenido-imagen"
          { git ls-files 'app/*.py' app/model_manifest.json requirements-serving.txt
            printf '%s\n' models/churn_model.joblib
          } | sed 's|^|/app/|' | sort > "$RUNNER_TEMP/contenido-esperado"
          diff -u "$RUNNER_TEMP/contenido-esperado" "$RUNNER_TEMP/contenido-imagen"
          docker image inspect --format '{{range .Config.Env}}{{println .}}{{end}}' "$imagen" \
            | cut -d= -f1 | sed '/^$/d' > "$RUNNER_TEMP/variables-imagen"
          if grep -Ei 'SECRET|PASSWORD|TOKEN|CREDENTIAL|API_KEY|^AWS_|^DAGSHUB_|^MLFLOW_' "$RUNNER_TEMP/variables-imagen"; then
            exit 1
          fi
          printf 'Contenido de aplicación y configuración de entorno verificados.\n'

      - name: Verificar el modelo y la API descargada por HTTP
        run: bash tests/smoke_docker.sh "$PAQUETE@$DIGEST"
