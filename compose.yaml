
services:
  churn-api:
    build: .
    image: istea-churn-api:etapa-4b-modelo-1
    ports:
      - "127.0.0.1:8001:8000"
    restart: unless-stopped
  prometheus:
    image: prom/prometheus:v3.5.0
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

volumes:
  prometheus-data:
